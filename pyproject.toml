[project]
name = "internship-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Franciszek Karpinski", email = "franek.karpinski1@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "rdkit>=2026.9.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
]

[project.scripts]
internship-project = "internship_project:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
